name: CI

# Pipeline do PR: roda em todo pull request e de novo depois do merge.
# O teste do site de homologação fica em homologacao.yml (depois do merge na homologacao).
on:
  pull_request:
  push:
    branches: [homologacao, main]

permissions:
  contents: read

jobs:
  app:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx oxlint src
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-anon-de-exemplo
      - name: Nenhum segredo no bundle
        run: node scripts/checar-segredos.mjs dist

  seguranca:
    name: Segurança (segredos e dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Nenhum segredo nos arquivos do repositório
        run: node scripts/checar-segredos.mjs
      - run: npm ci
      - name: Dependências do app sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high

  fluxo:
    name: Fluxo homologação → main
    runs-on: ubuntu-latest
    steps:
      - name: PR para a main só sai da homologacao
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "homologacao" ]; then
            echo "::error::PR para a main precisa vir da branch homologacao (veio de '$HEAD'). Abra o PR para a homologacao, teste lá e depois promova homologacao → main."
            exit 1
          fi
          echo "OK: ${HEAD:-push} → ${BASE:-${GITHUB_REF_NAME}}"

  rls:
    name: Testes de RLS (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
