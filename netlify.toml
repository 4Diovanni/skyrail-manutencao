[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=()"

# Arquivo de versão antiga que não existe mais: responde 404 em vez de devolver
# o index.html (que o navegador recusaria como módulo e o service worker poderia guardar).
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cada projeto da Netlify publica só a própria branch (homol: homologacao, prod: main).
# Previews de PR e deploys de outras branches são cancelados antes do build, para não gastar créditos.
# Os PRs são testados pelo CI do GitHub.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
